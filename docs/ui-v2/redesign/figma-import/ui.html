<!doctype html><html><head><style>body{font:14px/1.5 system-ui;padding:20px;color:#202e28}h2{font-size:20px}label{display:block;margin:14px 0}button{background:#28513f;color:white;border:0;border-radius:5px;padding:12px 18px;font:inherit;cursor:pointer}p{color:#59675e}select{padding:8px;width:100%}#status{white-space:pre-wrap}</style></head><body><h2>Bookvane V2 redesign</h2><p>Import the supplied scenes.json as native text, vector and image layers, plus clickable navigation. This importer has not been executed in Figma because MCP access is blocked.</p><label>Design export<input type="file" id="file" accept=".json"></label><label>Device<select id="device"><option value="both">Desktop + mobile</option><option>desktop</option><option>mobile</option></select></label><label>Theme<select id="theme"><option>light</option><option>dark</option><option value="both">Both</option></select></label><button id="import">Import designs</button><p id="status"></p><script>document.getElementById('import').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){document.getElementById('status').textContent='Select scenes.json first.';return}const data=JSON.parse(await f.text());data.scenes=data.scenes.filter(s=>(document.getElementById('device').value==='both'||s.device===document.getElementById('device').value)&&(document.getElementById('theme').value==='both'||s.theme===document.getElementById('theme').value));for(const key in data.assets){const decoded=atob(data.assets[key]);data.assets[key]=Array.from(decoded,c=>c.charCodeAt(0))}document.getElementById('status').textContent='Importing '+data.scenes.length+' frames…';parent.postMessage({pluginMessage:{type:'import',data}},'*')};onmessage=e=>{if(e.data.pluginMessage)document.getElementById('status').textContent=e.data.pluginMessage.message}</script></body></html>
