name: Verify cloud importer

on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [bookvane-verification-continue]

permissions:
  contents: read

jobs:
  isolated-tests:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalogue_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: bookvane_cloud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalogue_test -d bookvane_cloud_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://catalogue_test:disposable-test-only@127.0.0.1:5432/bookvane_cloud_test
      BOOKVANE_TEST_DB_ISOLATED: "yes"
      SECRET_KEY: disposable-cloud-test-key-not-for-production
      IS_DEV: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: StMichael9/Book-app
          ref: v2-codex
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Test ingestion with generated fixtures in disposable PostgreSQL
        run: python -m pytest tests/data -q
        working-directory: backend

  dispatch-probe:
    needs: isolated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify automatic continuation without invoking the production importer
        run: |
          curl --fail-with-body --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d '{"event_type":"bookvane-verification-continue"}'

  continuation-probe:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm GitHub token dispatch started the next cloud job
        run: echo "Automatic continuation event received. No production database access or import."
