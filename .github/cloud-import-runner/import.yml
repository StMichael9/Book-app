name: Import Bookvane catalogue

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Resume the saved run or start a new import
        type: choice
        options: [resume, new]
        default: resume
        required: true
      run_id:
        description: Existing run ID (used only for resume)
        type: string
        default: ol-20260930-2a5a6ccef5
      snapshot:
        description: Snapshot for NEW imports only (auto or YYYY-MM-DD)
        type: string
        default: auto
      target_books:
        description: Total catalogue size for NEW imports only
        type: string
        default: "50000"
      weights_json:
        description: Optional percentage weights for NEW imports only
        type: string
  repository_dispatch:
    types: [bookvane-catalogue-continue]

permissions:
  contents: read

concurrency:
  group: bookvane-catalogue-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      run_id: ${{ steps.ingest.outputs.run_id }}
      status: ${{ steps.ingest.outputs.status }}
      source_sha: ${{ steps.source.outputs.sha }}
    defaults:
      run:
        working-directory: book-app/backend
    env:
      CATALOGUE_DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      SECRET_KEY: importer-only-key-not-used-to-sign-app-tokens
      IS_DEV: "false"
      CATALOGUE_IMPORT_PRODUCTION: "yes"
      CATALOGUE_USER_AGENT: ${{ vars.CATALOGUE_USER_AGENT }}
      INPUT_OPERATION: ${{ inputs.operation }}
      INPUT_RUN_ID: ${{ inputs.run_id }}
      INPUT_SNAPSHOT: ${{ inputs.snapshot }}
      INPUT_TARGET_BOOKS: ${{ inputs.target_books }}
      INPUT_WEIGHTS_JSON: ${{ inputs.weights_json }}
      CONTINUE_RUN_ID: ${{ github.event.client_payload.run_id }}
      CONTINUE_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
    steps:
      - name: Pin importer code from Bookvane v2-codex
        id: source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            sha="$CONTINUE_SOURCE_SHA"
            [[ "$CONTINUE_RUN_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || exit 1
          else
            if [[ "$INPUT_OPERATION" == "resume" ]]; then
              [[ "$INPUT_RUN_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || exit 1
            fi
            sha=$(curl --fail-with-body --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/StMichael9/Book-app/git/ref/heads/v2-codex \
              | jq -r '.object.sha')
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Importer: StMichael9/Book-app at $sha (v2-codex at manual start)"
      - uses: actions/checkout@v4
        with:
          repository: StMichael9/Book-app
          ref: ${{ steps.source.outputs.sha }}
          path: book-app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: book-app/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run or resume the saved import
        id: ingest
        run: |
          args=(--mode production --time-budget-seconds 17400)
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            args+=(--run-id "$CONTINUE_RUN_ID" --resume-only)
          elif [[ "$INPUT_OPERATION" == "resume" ]]; then
            args+=(--run-id "$INPUT_RUN_ID" --resume-only)
          else
            args+=(--snapshot "$INPUT_SNAPSHOT" --target-books "$INPUT_TARGET_BOOKS")
            if [[ -n "$INPUT_WEIGHTS_JSON" ]]; then
              args+=(--weights-json "$INPUT_WEIGHTS_JSON")
            fi
          fi
          python -m data.load "${args[@]}"
          echo "### Catalogue result" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  continue:
    needs: import
    if: needs.import.outputs.status == 'needs_continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ needs.import.outputs.run_id }}
      SOURCE_SHA: ${{ needs.import.outputs.source_sha }}
    steps:
      - name: Continue from the same database checkpoint and importer commit
        run: |
          payload=$(jq -n --arg run_id "$RUN_ID" --arg source_sha "$SOURCE_SHA" \
            '{event_type:"bookvane-catalogue-continue", client_payload:{run_id:$run_id, source_sha:$source_sha}}')
          curl --fail-with-body --retry 3 --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d "$payload"
