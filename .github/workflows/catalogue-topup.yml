name: Catalogue nightly top-up

# After the catch-up weeks: add 300-500 of Open Library's trending and most-read books each night through the same gate as every
# reader pick, and once a month refresh popularity scores and retry lookups that gave up. Runs only while the repository variable
# CATALOGUE_TOPUP is 'on'.
on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Books to add (300-500 is normal)"
        required: false
        default: "400"
        type: string
      dry_run:
        description: "Report what would be added without writing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bookvane-catalogue-topup
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: catalogue-production
    if: ${{ github.event_name != 'schedule' || vars.CATALOGUE_TOPUP == 'on' }}
    defaults:
      run:
        working-directory: backend
    env:
      CATALOGUE_DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      SECRET_KEY: importer-only-key-not-used-to-sign-app-tokens
      IS_DEV: "false"
      CATALOGUE_USER_AGENT: ${{ vars.CATALOGUE_USER_AGENT }}
      LIMIT: ${{ inputs.limit || '400' }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Add the night's books
        run: |
          [[ "$LIMIT" =~ ^[0-9]{1,3}$ ]] || exit 1
          args=(--limit "$LIMIT")
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          # The first night of each month also refreshes popularity and gives failed lookups another go.
          if [[ "$(date -u +%d)" == "01" ]]; then args+=(--refresh-popularity --retry-failed); fi
          python -m data.top_up "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
