name: Import Open Library catalogue

on:
  schedule:
    # 02:00 Pacific, every night. Runs only while the repository variable CATALOGUE_NIGHTLY is 'on' (the owner switches it on
    # for the catch-up weeks and off again), and always against production.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Open Library snapshot: auto (newest complete) or YYYY-MM-DD"
        required: true
        default: auto
        type: string
      target_env:
        description: GitHub environment, which selects the database secret (rehearsal branch or production)
        required: true
        default: catalogue-rehearsal
        type: choice
        options:
          - catalogue-rehearsal
          - catalogue-production
      target_books:
        description: Total Book rows including existing rows; blank means 150000 on production and current books + 2000 on the rehearsal branch
        required: false
        default: ""
        type: string
      production_size_mb:
        description: Rehearsal only - size of the production database counted against the 750 MB project guard
        required: false
        default: "250"
        type: string
      weights_json:
        description: Optional JSON percentage weights; blank means equal weights
        required: false
        type: string
      resume_run_id:
        description: Optional run id to resume (for example after a dry run); merges that same run, never a dry run
        required: false
        type: string
      add_books:
        description: Books to add in this run (night 1 is 5000, later nights about 17000); blank uses target_books
        required: false
        default: ""
        type: string
      dry_run:
        description: Dry run - stage and predict what the merge would add and fill, write no book, upload the report
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [bookvane-catalogue-continue]

permissions:
  contents: read

concurrency:
  group: bookvane-catalogue-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: ${{ inputs.target_env || github.event.client_payload.target_env || 'catalogue-production' }}
    if: ${{ github.event_name != 'schedule' || vars.CATALOGUE_NIGHTLY == 'on' }}
    # The importer's scratch tables live in this runner-local Postgres, never in the catalogue database. Between segments of
    # one run they travel as a pg_dump artifact (see the restore and keep steps).
    services:
      stage-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stage
          POSTGRES_DB: stage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    outputs:
      run_id: ${{ steps.ingest.outputs.run_id }}
      status: ${{ steps.ingest.outputs.status }}
      source_sha: ${{ steps.source.outputs.sha }}
      dry_run: ${{ steps.source.outputs.dry_run }}
    defaults:
      run:
        working-directory: backend
    env:
      CATALOGUE_DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      CATALOGUE_STAGE_DATABASE_URL: postgresql+psycopg2://postgres:stage@localhost:5432/stage
      SECRET_KEY: importer-only-key-not-used-to-sign-app-tokens
      IS_DEV: "false"
      CATALOGUE_IMPORT_PRODUCTION: "yes"
      CATALOGUE_USER_AGENT: ${{ vars.CATALOGUE_USER_AGENT }}
      INPUT_RUN_ID: ${{ github.event.client_payload.run_id }}
      INPUT_TARGET_ENV: ${{ inputs.target_env || github.event.client_payload.target_env || 'catalogue-production' }}
      INPUT_ADD_BOOKS: ${{ inputs.add_books || vars.CATALOGUE_NIGHTLY_ADD_BOOKS }}
      INPUT_DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run }}
      INPUT_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      INPUT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
      INPUT_SNAPSHOT: ${{ inputs.snapshot || 'auto' }}
      INPUT_TARGET_BOOKS: ${{ inputs.target_books }}
      INPUT_PRODUCTION_SIZE_MB: ${{ inputs.production_size_mb || '250' }}
      INPUT_WEIGHTS_JSON: ${{ inputs.weights_json }}
    steps:
      - name: Pin checkout to the original import code
        id: source
        working-directory: .
        run: |
          dry_run="$INPUT_DRY_RUN"
          run_id=""
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            sha="$INPUT_SOURCE_SHA"
            run_id="$INPUT_RUN_ID"
            [[ "$run_id" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || exit 1
          else
            sha="$GITHUB_SHA"
            if [[ -n "$INPUT_RESUME_RUN_ID" ]]; then
              # Resuming an existing run: never a dry run, and no new snapshot or target is chosen.
              run_id="$INPUT_RESUME_RUN_ID"
              [[ "$run_id" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || exit 1
              dry_run=false
            fi
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      # Migrations remain a separate reviewed deployment action. The importer
      # must never migrate the production application database implicitly.
      # The popularity file is runner-local scratch; carry it between segments. If it is missing the importer
      # rebuilds it from the dumps, so a failed download is not an error.
      - name: Restore the popularity file
        if: ${{ steps.source.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: catalogue-state-${{ steps.source.outputs.run_id }}
          path: ${{ runner.temp }}/catalogue-state
      - name: Restore the staging tables from the previous segment
        if: ${{ steps.source.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: catalogue-stage-${{ steps.source.outputs.run_id }}
          path: ${{ runner.temp }}/catalogue-stage
      - name: Load the restored staging tables into the runner database
        if: ${{ steps.source.outputs.run_id != '' }}
        working-directory: .
        run: |
          if [[ -f "$RUNNER_TEMP/catalogue-stage/stage.dump" ]]; then
            id=$(docker ps -q --filter ancestor=postgres:16 | head -1)
            docker exec -i "$id" pg_restore -U postgres -d stage --no-owner < "$RUNNER_TEMP/catalogue-stage/stage.dump"
            echo "Restored staging tables from the previous segment"
          fi
      - name: Run or resume the checkpointed import
        id: ingest
        env:
          RESUME_ID: ${{ steps.source.outputs.run_id }}
          EFFECTIVE_DRY_RUN: ${{ steps.source.outputs.dry_run }}
        run: |
          [[ "$INPUT_TARGET_ENV" == "catalogue-rehearsal" || "$INPUT_TARGET_ENV" == "catalogue-production" ]] || exit 1
          args=(--mode production --time-budget-seconds 17400 --max-database-mb 800 --state-dir "$RUNNER_TEMP/catalogue-state")
          if [[ "$INPUT_TARGET_ENV" == "catalogue-rehearsal" ]]; then
            [[ "$INPUT_PRODUCTION_SIZE_MB" =~ ^[0-9]{1,4}$ ]] || exit 1
            args+=(--production-size-mb "$INPUT_PRODUCTION_SIZE_MB" --max-project-mb 750)
          fi
          if [[ "$EFFECTIVE_DRY_RUN" == "true" ]]; then
            args+=(--dry-run --dry-run-report "$RUNNER_TEMP/dry-run-report.json")
          fi
          if [[ -n "$RESUME_ID" ]]; then
            args+=(--run-id "$RESUME_ID" --resume-only)
          else
            args+=(--snapshot "$INPUT_SNAPSHOT")
            if [[ -n "$INPUT_ADD_BOOKS" ]]; then
              [[ "$INPUT_ADD_BOOKS" =~ ^[0-9]{1,6}$ ]] || exit 1
              args+=(--add-books "$INPUT_ADD_BOOKS")
            elif [[ -n "$INPUT_TARGET_BOOKS" ]]; then
              args+=(--target-books "$INPUT_TARGET_BOOKS")
            elif [[ "$INPUT_TARGET_ENV" == "catalogue-rehearsal" ]]; then
              args+=(--add-books 2000)
            else
              args+=(--target-books 150000)
            fi
            if [[ -n "$INPUT_WEIGHTS_JSON" ]]; then
              args+=(--weights-json "$INPUT_WEIGHTS_JSON")
            fi
          fi
          python -m data.load "${args[@]}"
      - name: Keep the popularity file for the next segment
        if: ${{ always() && steps.ingest.outputs.run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-state-${{ steps.ingest.outputs.run_id }}
          path: ${{ runner.temp }}/catalogue-state
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
      - name: Dump the staging tables for the next segment
        id: stage_dump
        if: ${{ always() && steps.ingest.outputs.run_id != '' && steps.ingest.outputs.status != 'complete' }}
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/catalogue-stage-out"
          id=$(docker ps -q --filter ancestor=postgres:16 | head -1)
          # The staging database holds Open Library data only; the importer refuses to start otherwise. Names of the
          # tables are listed so nothing else can ever be added to the artifact (the repository is public).
          docker exec "$id" pg_dump -Fc -U postgres -d stage -t catalogue_import_runs -t catalogue_import_issues \
            -t catalogue_source_aliases -t catalogue_stage_works -t catalogue_stage_popularity -t catalogue_stage_author_counts \
            -t catalogue_stage_candidates -t catalogue_stage_work_authors -t catalogue_stage_authors -t catalogue_stage_editions \
            > "$RUNNER_TEMP/catalogue-stage-out/stage.dump"
          size=$(( $(stat -c %s "$RUNNER_TEMP/catalogue-stage-out/stage.dump") / 1048576 ))
          echo "stage_dump_mb=$size" >> "$GITHUB_OUTPUT"
          echo "Segment staging dump: ${size} MiB" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the staging tables for the next segment
        if: ${{ always() && steps.stage_dump.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-stage-${{ steps.ingest.outputs.run_id }}
          path: ${{ runner.temp }}/catalogue-stage-out
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
      - name: Upload the dry-run report
        if: ${{ always() && steps.source.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-dry-run-report
          path: ${{ runner.temp }}/dry-run-report.json
          if-no-files-found: ignore

  continue:
    needs: import
    if: needs.import.outputs.status == 'needs_continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ needs.import.outputs.run_id }}
      SOURCE_SHA: ${{ needs.import.outputs.source_sha }}
      TARGET_ENV: ${{ inputs.target_env || github.event.client_payload.target_env || 'catalogue-production' }}
      DRY_RUN: ${{ needs.import.outputs.dry_run }}
    steps:
      - name: Dispatch the next checkpointed segment
        run: |
          payload=$(jq -n --arg run_id "$RUN_ID" --arg source_sha "$SOURCE_SHA" --arg target_env "$TARGET_ENV" \
            --arg dry_run "$DRY_RUN" \
            '{event_type:"bookvane-catalogue-continue", client_payload:{run_id:$run_id, source_sha:$source_sha, target_env:$target_env, dry_run:$dry_run}}')
          curl --fail-with-body --retry 3 --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d "$payload"
