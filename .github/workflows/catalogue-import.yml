name: Import Open Library catalogue

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Open Library snapshot: auto (newest complete) or YYYY-MM-DD"
        required: true
        default: auto
        type: string
      target_books:
        description: Total Book rows including existing rows
        required: true
        default: "50000"
        type: string
      weights_json:
        description: Optional JSON percentage weights; blank means equal weights
        required: false
        type: string
  repository_dispatch:
    types: [bookvane-catalogue-continue]

permissions:
  contents: read

concurrency:
  group: bookvane-catalogue-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: catalogue-production
    outputs:
      run_id: ${{ steps.ingest.outputs.run_id }}
      status: ${{ steps.ingest.outputs.status }}
      source_sha: ${{ steps.source.outputs.sha }}
    defaults:
      run:
        working-directory: backend
    env:
      CATALOGUE_DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.CATALOGUE_DATABASE_URL }}
      SECRET_KEY: importer-only-key-not-used-to-sign-app-tokens
      IS_DEV: "false"
      CATALOGUE_IMPORT_PRODUCTION: "yes"
      CATALOGUE_USER_AGENT: ${{ vars.CATALOGUE_USER_AGENT }}
      INPUT_RUN_ID: ${{ github.event.client_payload.run_id }}
      INPUT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
      INPUT_SNAPSHOT: ${{ inputs.snapshot }}
      INPUT_TARGET_BOOKS: ${{ inputs.target_books }}
      INPUT_WEIGHTS_JSON: ${{ inputs.weights_json }}
    steps:
      - name: Pin checkout to the original import code
        id: source
        working-directory: .
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            sha="$INPUT_SOURCE_SHA"
            [[ "$INPUT_RUN_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || exit 1
          else
            sha="$GITHUB_SHA"
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      # Migrations remain a separate reviewed deployment action. The importer
      # must never migrate the production application database implicitly.
      - name: Run or resume the checkpointed import
        id: ingest
        run: |
          args=(--mode production --time-budget-seconds 17400)
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            args+=(--run-id "$INPUT_RUN_ID")
          else
            args+=(--snapshot "$INPUT_SNAPSHOT" --target-books "$INPUT_TARGET_BOOKS")
            if [[ -n "$INPUT_WEIGHTS_JSON" ]]; then
              args+=(--weights-json "$INPUT_WEIGHTS_JSON")
            fi
          fi
          python -m data.load "${args[@]}"

  continue:
    needs: import
    if: needs.import.outputs.status == 'needs_continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ needs.import.outputs.run_id }}
      SOURCE_SHA: ${{ needs.import.outputs.source_sha }}
    steps:
      - name: Dispatch the next checkpointed segment
        run: |
          payload=$(jq -n --arg run_id "$RUN_ID" --arg source_sha "$SOURCE_SHA" \
            '{event_type:"bookvane-catalogue-continue", client_payload:{run_id:$run_id, source_sha:$source_sha}}')
          curl --fail-with-body --retry 3 --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d "$payload"
