<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Discover books, save what catches your eye, and make a personal library with Bookvane." /><title>Bookvane</title>
<script>
  let theme;
  try { theme = window.localStorage.getItem("bookvane-theme"); } catch {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme;
  const background = theme === "dark" ? "#1e1d1b" : "#faf8f2";
  document.documentElement.style.backgroundColor = background;
  document.documentElement.style.setProperty("--bg", background);
</script></head>
<body><div id="root"></div><script type="module" src="./preview.jsx"></script></body></html>
